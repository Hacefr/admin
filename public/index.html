<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Staff Application Desk</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --mc-gold: #FFAA00; --mc-yellow: #FFFF55; --mc-green: #55FF55;
      --mc-red: #FF5555; --mc-aqua: #55FFFF; --mc-gray: #AAAAAA;
      --mc-dark-gray: #555555; --mc-white: #FFFFFF; --mc-gui-bg: #212121;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; image-rendering: pixelated; }
    body {
      background: #141414; color: var(--mc-white); font-family: 'VT323', monospace;
      font-size: 1.35rem; padding: 30px 15px;
    }
    body.clean-font { font-family: 'Inter', sans-serif; font-size: 1rem; }
    body.clean-font h1, body.clean-font h2, body.clean-font .btn, body.clean-font label { font-family: 'Inter', sans-serif; }
    .container { max-width: 800px; margin: 0 auto; }
    .mc-frame {
      background: var(--mc-gui-bg); border: 4px solid #000;
      box-shadow: inset 4px 4px 0px #3d3d3d, inset -4px -4px 0px #111; padding: 25px; margin-bottom: 25px;
    }
    .top-bar { display: flex; justify-content: space-between; margin-bottom: 15px; }
    .top-bar a { color: var(--mc-aqua); text-decoration: none; font-size: 1.1rem; }
    h1 { font-family: 'Press Start 2P', monospace; font-size: 1.3rem; color: var(--mc-yellow); margin-bottom: 15px; text-shadow: 2px 2px #000; text-align: center; }
    h2 { font-family: 'Press Start 2P', monospace; font-size: 0.85rem; color: var(--mc-gold); margin-bottom: 12px; }
    .field { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-family: 'Press Start 2P', monospace; font-size: 0.65rem; color: var(--mc-gold); }
    input, select, textarea {
      width: 100%; background: #000; border: 2px solid var(--mc-dark-gray); color: #fff;
      font-family: inherit; font-size: 1.25rem; padding: 8px;
    }
    .btn {
      background: #2e7d32; border: 3px solid; border-color: #66bb6a #1b5e20 #1b5e20 #66bb6a;
      color: #fff; padding: 10px; font-family: 'Press Start 2P', monospace; font-size: 0.75rem;
      cursor: pointer; width: 100%;
    }
    .btn:hover { background: #388e3c; }
    .saved-box { background: #111; border: 2px solid var(--mc-aqua); padding: 15px; margin-bottom: 20px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="mc-frame">
      <div class="top-bar">
        <a href="admin.html">[ OWNER LOGIN ]</a>
        <button onclick="document.body.classList.toggle('clean-font')" style="background:#333;color:#fff;border:1px solid #777;padding:4px 8px;cursor:pointer;">[ TOGGLE FONT ]</button>
      </div>

      <!-- Auto-Saved Ticket Banner -->
      <div id="savedBox" class="saved-box">
        <h2>// ACTIVE TICKET DETECTED</h2>
        <p>Found your recent application in browser memory: <strong id="savedCode" style="color:var(--mc-yellow);"></strong></p>
        <button class="btn" style="background:#373737;border-color:#555 #111 #111 #555;margin-top:8px;" onclick="goToSaved()">OPEN MY ACTIVE TICKET</button>
      </div>

      <!-- Application Form -->
      <h1>// STAFF RECRUITMENT FORM</h1>
      <form id="applyForm">
        <div class="field">
          <label>IN-GAME USERNAME (IGN)</label>
          <input type="text" id="ign" placeholder="e.g. Steve" required />
        </div>
        <div class="field">
          <label>DISCORD USERNAME</label>
          <input type="text" id="discord" placeholder="e.g. steve#0000 or @steve" required />
        </div>
        <div class="field">
          <label>ROLE APPLYING FOR</label>
          <select id="role" required>
            <option value="QA Tester">QA TESTER</option>
            <option value="Helper">HELPER</option>
            <option value="Moderator">MODERATOR</option>
          </select>
        </div>
        <div class="field">
          <label>PREVIOUS MINECRAFT & STAFF EXPERIENCE</label>
          <textarea id="experience" rows="3" placeholder="List past servers, roles, or familiarity with this server..." required></textarea>
        </div>
        <div class="field">
          <label>WHY DO YOU WANT THIS POSITION?</label>
          <textarea id="reason" rows="3" placeholder="Tell us your goals, schedule, and why you should be picked..." required></textarea>
        </div>
        <button type="submit" class="btn">TRANSMIT APPLICATION</button>
      </form>

      <!-- Ticket Search Box -->
      <div style="margin-top: 30px; border-top: 2px dashed #444; padding-top: 20px;">
        <h2>// TRACK EXISTING APPLICATION</h2>
        <div style="display:flex; gap: 8px;">
          <input type="text" id="searchCode" placeholder="Enter Ticket Code (e.g. APP-A1B2C3)" style="text-transform:uppercase;" />
          <button class="btn" style="width: auto; background:#737373; border-color:#dbdbdb #373737 #373737 #dbdbdb;" onclick="searchTicket()">TRACK</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Check local storage for recent ticket
    const recent = localStorage.getItem('mc_ticket_code');
    if (recent) {
      document.getElementById('savedBox').style.display = 'block';
      document.getElementById('savedCode').textContent = recent;
    }

    function goToSaved() {
      window.location.href = `ticket.html?code=${recent}`;
    }

    function searchTicket() {
      const code = document.getElementById('searchCode').value.trim();
      if (code) window.location.href = `ticket.html?code=${code}`;
    }

    document.getElementById('applyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        ign: document.getElementById('ign').value,
        discord: document.getElementById('discord').value,
        role: document.getElementById('role').value,
        experience: document.getElementById('experience').value,
        reason: document.getElementById('reason').value
      };

      const res = await fetch('/api/apply', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem('mc_ticket_code', data.ticketCode);
        window.location.href = `ticket.html?code=${data.ticketCode}`;
      } else {
        alert(data.error);
      }
    });
  </script>
</body>
</html>
